<script>
console.log("JERICHO v3.0 SUPABASE - " + new Date().toISOString());
/* =========================================================

const SUPABASE_URL = 'https://hvlenkxjuauozezonsim.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2bGVua3hqdWF1b3plem9uc2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNjkyNDIsImV4cCI6MjEwNTg0NTI0Mn0.DSA2FKKjlAQqEynjq3fe9LLDXj-oMwHf_X22wjHLAI4';

let DB = { utilisateurs: [], prospects: [], clients: [], sav: [], stock: [], ventes: [], tickets: [], apporteurs: [], paie: [], avances: [], config: [], contacts: [] };
const DEFAULT_PAYMENT_MODES = ['Espèces','Orange Money','Moov Money','Telecel Money','Chèque'];

let loaded = false;
let _clientIndexCache = null;
let _clientIndexVentesLen = 0;

function getCachedClientIndex(ventes){
  // Recalculer seulement si les ventes ont changé
  if(_clientIndexCache && ventes.length === _clientIndexVentesLen) return _clientIndexCache;
  _clientIndexCache = buildClientIndex(ventes);

function normalizeRow(row){
  const out = {...row};
  Object.keys(out).forEach(key=>{
    if(key==='id') out[key] = String(out[key]);
    else if(/date/i.test(key) && typeof out[key]==='string' && /^\d{4}-\d{2}-\d{2}T/.test(out[key])){
      out[key] = out[key].slice(0,10);
    }
  });
  if(out.historiqueJSON !== undefined){
    try{ out.historique = out.historiqueJSON ? JSON.parse(out.historiqueJSON) : []; }catch(e){ out.historique = []; }
  }
  return out;
}

function sbH() {
  return {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Prefer': 'return=representation'
  };
}
// Mapping colonnes Supabase (minuscules) → camelCase app
const COL_MAP = {
  // Ventes
  'dateMiseEnRelation': 'datemiseenrelation',
  'businessUnit': 'businessunit',
  'typeArticle': 'typearticle',
  'assuranceAutre': 'assuranceautre',
  'saisePar': 'saisepar',
  'odSphere': 'odsphere', 'odCylindre': 'odcylindre', 'odAxe': 'odaxe', 'odAddition': 'odaddition',
  'ogSphere': 'ogsphere', 'ogCylindre': 'ogcylindre', 'ogAxe': 'ogaxe', 'ogAddition': 'ogaddition',
  'caracteristiqueVerre': 'caracteristiqueverre',
  'prixVenteMonture': 'prixventemonture', 'prixVenteLentilles': 'prixventelentilles',
  'prixVenteLentilles2e': 'prixventelentilles2e', 'prixVenteMonture2e': 'prixventemonture2e',
  'prixVenteTotalSansRemise': 'prixventetotalsansremise',
  'montantBonNonEncaisse': 'montantbonnonencaisse',
  'modePaiement': 'modepaiement',
  'dateRdv': 'daterdv',
  'apporteurAffaire': 'apporteuraffaire', 'apporteurAffaireAutre': 'apporteuraffaireautre',
  // Prospects/Clients
  'telephone2': 'telephone2',
  // Tickets
  'clientNom': 'clientnom', 'clientPrenom': 'clientprenom',
  'clientCivilite': 'clientcivilite', 'clientTel': 'clienttel', 'clientTel2': 'clienttel2',
  'dateCreation': 'datecreation', 'dateLimite': 'datelimite', 'venteId': 'venteid',
  // Paie
  'primeBrute': 'primebrute', 'prime70': 'prime70', 'prime30': 'prime30',
  'prime30Libere': 'prime30libere', 'totalAvances': 'totalavances', 'netAPayer': 'netapayer',
  'dateValidation': 'datevalidation',
};

function denormalizeRow(row) {
  const out = {};
  // Construire le mapping inverse : minuscule → camelCase
  const inv = {};
  for (const [camel, lower] of Object.entries(COL_MAP)) inv[lower] = camel;
  for (const [k, v] of Object.entries(row)) {
    const key = inv[k] || k;
    // Parser automatiquement les champs JSON stockés comme string
    if(key === 'historique' && typeof v === 'string'){
      try{ out[key] = JSON.parse(v); }catch(e){ out[key] = []; }
    } else {
      out[key] = v;
    }
  }
  return out;
}

async function apiGet(table) {
  const url = SUPABASE_URL + '/rest/v1/' + table + '?select=*&limit=5000&offset=0';
  const res = await fetch(url, { headers: {...sbH(), 'Range-Unit': 'items', 'Range': '0-4999'} });
  if (!res.ok) throw new Error('GET ' + table + ' ' + res.status);
  const rows = await res.json();
  if (!Array.isArray(rows)) return [];
  return rows.map(denormalizeRow);
}
// Convertir camelCase → minuscules pour Supabase
function toSupabase(row) {
  const out = {};
  for (const [k, v] of Object.entries(row)) {
    out[k.toLowerCase()] = v;
  }
  return out;
}

async function apiUpsert(table, row) {
  const url = SUPABASE_URL + '/rest/v1/' + table;
  const res = await fetch(url, {
    method: 'POST',
    headers: { ...sbH(), 'Prefer': 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(toSupabase(row))
  });
  if (!res.ok) { const e = await res.text(); throw new Error('UPSERT ' + table + ': ' + e); }
  const data = await res.json();
  // Supabase retourne un tableau - normaliser en objet
  const result = Array.isArray(data) ? (data[0] || {}) : data;
  return { ok: true, ...result };
}
async function apiDelete(table, id) {
  const url = SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + encodeURIComponent(id);
  const res = await fetch(url, { method: 'DELETE', headers: sbH() });
  if (!res.ok) throw new Error('DELETE ' + table + ' ' + res.status);
  return true;
}
function normalizeUser(u) {
  // Supabase retourne les colonnes en minuscules - on remet les bonnes clés
  return {
    id: u.id || '',
    nom: u.nom || '',
    motDePasse: u.motdepasse || u.motDePasse || '',
    role: u.role || '',
    boutique: u.boutique || '',
    actif: u.actif || '',
    objectifAnnuel: u.objectifannuel || u.objectifAnnuel || '',
    objectifsMensuels: u.objectifsmensuels || u.objectifsMensuels || '{}',
    salaireBase: u.salairebase || u.salaireBase || '',
    dateCreation: u.datecreation || u.dateCreation || '',
    derniereConnexion: u.derniereconnexion || u.derniereConnexion || '',
  };
}
async function loadUsers() {
  try {
    const rows = await apiGet('utilisateurs');
    const normalized = rows.map(normalizeUser);
    USERS_ALL_CACHE = normalized;
    USERS_CACHE = normalized.filter(u => u.actif === 'oui');
  } catch(e) { console.error('loadUsers:', e); }
}
async function saveUser(userRow) {
  await apiUpsert('utilisateurs', userRow);
  await loadUsers();
}
async function savePaymentModes(modesArray) {
  const row = { id: 'modes_paiement', valeur: JSON.stringify(modesArray) };
  try {
    await apiUpsert('config', row);
  } catch(e) {
    showToast('Erreur sauvegarde modes : ' + e.message);
    console.error('savePaymentModes:', e);
    throw e;
  }
  // Mise à jour cache local immédiate
  const idx = DB.config.findIndex(c=>c.id==='modes_paiement');
  if(idx>=0) DB.config[idx]=row; else DB.config.push(row);
  // Resynchroniser depuis Supabase en arrière-plan
  try { DB.config = await apiGet('config'); } catch(e) {}
}
async function loadAll() {
  const prioritaires = ['utilisateurs', 'ventes', 'prospects', 'clients'];
  const secondaires = ['sav', 'stock', 'tickets', 'apporteurs', 'paie', 'avances', 'config', 'contacts'];
  const resPrio = await Promise.allSettled(prioritaires.map(k => apiGet(k)));
  resPrio.forEach((r, i) => {
    const k = prioritaires[i];
    if (DB.hasOwnProperty(k)) DB[k] = r.status === 'fulfilled' ? r.value : [];
  });
  if (DB.utilisateurs) {
    USERS_ALL_CACHE = DB.utilisateurs;
    USERS_CACHE = DB.utilisateurs.filter(u => u.actif === 'oui');
  }
  loaded = true;
  Promise.allSettled(secondaires.map(k => apiGet(k))).then(results => {
    results.forEach((r, i) => {
      const k = secondaires[i];
      if (DB.hasOwnProperty(k)) DB[k] = r.status === 'fulfilled' ? r.value : [];
    });
    _clientIndexCache = null;
    window._jCache = null;
  });
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

// ===== NORMALISATION TÉLÉPHONE =====
// Identifiant unique d'un client = numéro normalisé (sans espaces, sans 0 initial, sans indicatif 226)
function normTel(v){
  if(!v) return '';
  let s = String(v).replace(/[\s\.\-\(\)]/g,'').split('.')[0];
  // Retirer l'indicatif Burkina
  if(s.startsWith('00226')) s = s.slice(5);
  if(s.startsWith('+226')) s = s.slice(4);
  if(s.startsWith('226') && s.length > 9) s = s.slice(3);
  // Retirer le 0 initial SEULEMENT si le résultat donne 8 chiffres (numéros mobiles BF)
  // Ex: 070626068 (9 chiffres) → 70626068 (8 chiffres) = OK
  // Ex: 07062606 (8 chiffres avec 0) → on garde le 0 (fixe ou autre format)
  if(s.startsWith('0') && s.length === 9) s = s.slice(1);
  return s;
}

// Clé client : téléphone normalisé en priorité, sinon NOM+PRENOM
function clientKey(v){
  const tel = normTel(v.telephone);
  if(tel) return 'tel:'+tel;
  return 'nom:'+(v.nom||'').toLowerCase().trim()+'_'+(v.prenom||'').toLowerCase().trim();
}

// Index groupé de toutes les ventes par client
function buildClientIndex(ventes){
  const idx = {};
  ventes.forEach(v=>{
    const key = clientKey(v);
    if(!idx[key]){
      idx[key] = {
        key,
        telephone: normTel(String(v.telephone||'')),
        telephone2: v.telephone2||'',
        nom: v.nom||'',
        prenom: v.prenom||'',
        civilite: v.civilite||'',
        adresse: v.adresse||'',
        boutique: v.businessUnit||'',
        ventes: [],
      };
    }
    idx[key].ventes.push(v);
    // Garder le nom le plus récent
    if((v.dateMiseEnRelation||'') >= (idx[key].lastDate||'')) {
      idx[key].lastDate = v.dateMiseEnRelation||'';
      if(v.nom) idx[key].nom = v.nom;
      if(v.prenom) idx[key].prenom = v.prenom;
      if(v.adresse) idx[key].adresse = v.adresse;
    }
  });
  // Calculer les stats par client
  Object.values(idx).forEach(c=>{
    c.ventes.sort((a,b)=>(b.dateMiseEnRelation||'').localeCompare(a.dateMiseEnRelation||''));
    c.derniereVente = c.ventes[0];
    c.premiereVente = c.ventes[c.ventes.length-1];
    c.caTotal = c.ventes.reduce((a,v)=>a+venteTotal(v),0);
    c.resteTotal = c.ventes.reduce((a,v)=>a+venteReste(v),0);
    c.nbVentes = c.ventes.length;
    c.derniereDate = (c.derniereVente?.dateMiseEnRelation||'').slice(0,10);
    c.dernierType = c.derniereVente?.typeArticle||'';
    // Dernière prescription
    c.prescription = c.ventes.find(v=>v.odSphere||v.ogSphere) || null;
  });
  return idx;
}

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtFCFA(n){
  n = Number(n)||0;
  // Séparateurs de milliers avec espace insécable, pas de décimales
  return n.toLocaleString('fr-FR', {maximumFractionDigits:0}) + ' FCFA';
}
// Modal de saisie texte (remplace prompt() bloqué sur GitHub Pages)
let _promptCallback = null;
function showPrompt(label, defaultVal, onOk) {

// Ouvre la popup motif, enregistre le contact, puis ouvre WhatsApp
function showContactModal(clientNom, clientId, telephone, boutique, waUrl) {
  _pendingContact = { clientNom, clientId, telephone, boutique, waUrl };
  const old = document.getElementById('jericho-contact-modal');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'jericho-contact-modal';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center;';
  const btns = MOTIFS_CONTACT.map((m,i)=>
    `<button data-motif-idx="${i}" style="padding:9px 12px;border-radius:8px;border:1.5px solid #e0ddd4;background:#fafaf8;font-size:12px;font-weight:500;cursor:pointer;text-align:left;">${escapeHtml(m)}</button>`
  ).join('');
  overlay.innerHTML = `<div style="background:#fff;border-radius:12px;padding:24px 28px;max-width:400px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <div style="font-size:15px;font-weight:700;color:#26282B;margin-bottom:4px;">📱 Contact WhatsApp</div>
    <div style="font-size:13px;color:#888;margin-bottom:4px;">${escapeHtml(clientNom)}</div>
    <div style="font-size:12px;color:#aaa;margin-bottom:16px;">Commercial : <b>${escapeHtml(state.commercial||'')}</b></div>
    <div style="font-size:13px;font-weight:600;color:#555;margin-bottom:10px;">Motif du contact :</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;">${btns}</div>
    <div style="text-align:center;">
      <button id="wa-modal-cancel" style="padding:8px 20px;border-radius:8px;border:1.5px solid #ddd;background:#fff;font-size:13px;cursor:pointer;color:#888;">Annuler</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', async function(e) {
    // Bouton motif
    const motifBtn = e.target.closest('[data-motif-idx]');
    if(motifBtn) {
      const motifIdx = parseInt(motifBtn.dataset.motifIdx);
      const motif = MOTIFS_CONTACT[motifIdx];
      overlay.remove();
      const c = _pendingContact; _pendingContact = null;
      if(!c) return;
      const contact = {
        id: 'ct_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        clientid: c.clientId || '',
        clientnom: c.clientNom || '',
        telephone: c.telephone || '',
        date: todayISO(),
        motif,
        commercial: state.commercial || '',
        boutique: c.boutique || state.boutique || '',
      };
      try {
        await apiUpsert('contacts', contact);
        if(!DB.contacts) DB.contacts = [];
        DB.contacts.unshift(contact);
        showToast('✅ Contact enregistré — ' + motif);
      } catch(err) {
        console.error('Erreur contact:', err);
      }
      window.open(c.waUrl, '_blank', 'noopener');
      return;
    }
    // Bouton annuler
    if(e.target.id === 'wa-modal-cancel' || e.target === overlay) {
      overlay.remove();
      _pendingContact = null;
    }
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function setCommercial(nom, role, userId, boutique){
  state.commercial = nom;
  state.role = role;
  state.userId = userId;
  state.boutique = boutique || '';
  state.teamTab = role==='admin' ? 'dashboard' : 'journee';
  state.view = nom ? 'equipe' : 'accueil'; // connexion → equipe, déconnexion → accueil
  try{
    sessionStorage.setItem('jo_commercial', nom);
    sessionStorage.setItem('jo_role', role);
    sessionStorage.setItem('jo_userId', userId || '');
    sessionStorage.setItem('jo_boutique', boutique || '');
    sessionStorage.setItem('jo_tab', state.teamTab);
    if(!nom){ // Déconnexion — tout effacer
      sessionStorage.removeItem('jo_commercial');
      sessionStorage.removeItem('jo_role');
      sessionStorage.removeItem('jo_userId');
      sessionStorage.removeItem('jo_boutique');
      sessionStorage.removeItem('jo_tab');
    }
  }catch(e){}
}

function render(){
  const app = document.getElementById('app');
  if(typeof state === 'undefined'){ console.error("state not defined!"); return; }
  if(state.view==='accueil'){
    app.innerHTML = renderPublic();
  } else {
    app.innerHTML = `${renderTopbar()}${renderTeam()}`;
  }
  attachGlobalEvents();
  if(state.modal) renderModal();
}

        btn.textContent = 'Envoi en cours…'; btn.disabled = true;
        try{
          const today = new Date().toISOString().slice(0,10);
          // Génération ID unique (même logique que uid() dans l'app)
          const newId = Date.now().toString(36) + Math.random().toString(36).slice(2,7);

            civilite: civilite,
            nom: nom,
            prenom: prenom,
            telephone: tel,
            boutique: boutique||'',

            source: 'Site web',

            notes: 'Demande de RDV via le site web'

            method:'POST',
            headers:{
              'Content-Type':'application/json',
              'apikey':SUPABASE_KEY,
              'Authorization':'Bearer '+SUPABASE_KEY,
              'Prefer':'return=minimal'
            },
            body: JSON.stringify(payload)
          });
          if(!res.ok){
            let detail = '';
            try{ const j = await res.json(); detail = j.message||j.error||JSON.stringify(j); }catch(e){}
            throw new Error('HTTP '+res.status+' — '+detail);
          }
          // Succès
          document.getElementById('rdv-form-wrap').style.display='none';
          document.getElementById('rdv-success').style.display='block';
          document.getElementById('rdv-success-nom').textContent = prenom+' '+nom;
          document.getElementById('rdv-success-tel').textContent = tel;
        }catch(err){
          errDiv.textContent = 'Erreur : '+err.message+'. Contactez-nous directement sur WhatsApp si le problème persiste.';
          errDiv.style.display='block';
          btn.textContent='Demander un rendez-vous →'; btn.disabled=false;
        }
      });
    }
  });
}

        const tel=c.telephone||'';const num=tel.startsWith('226')?tel:'226'+tel;

function renderMiniTable(rows, headers, mapRow){
  if(!rows.length) return `<p style="color:#9a998f;font-size:13.5px;font-style:italic;">Rien à afficher pour l'instant.</p>`;
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${mapRow(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
}

function statutBadge(statut, kind){
  const map = {
    prospect: {'Nouveau':'b-new','Contacté':'b-contact','Rendez-vous pris':'b-rdv','Converti en client':'b-won','Perdu':'b-lost'},
    sav: {'Ouvert':'b-open','En cours':'b-progress','En attente de pièce':'b-wait','Résolu':'b-done'}
  };
  const cls = (map[kind]||{})[statut] || 'b-new';
  return `<span class="badge ${cls}">${escapeHtml(statut)}</span>`;
}

function venteTotal(v){
  if(v.typeArticle==='Réparation et entretien') return Number(v.cout)||0;
  if(v.typeArticle==='Accessoires') return (Number(v.prixVenteMontureAcc)||0) - (Number(v.remiseAcc)||0) + (Number(v.montantAchatSpray)||0) + (Number(v.montantVenteEtui)||0) + (Number(v.montantVenteEssuieVerre)||0);
  return (Number(v.prixVenteTotalSansRemise)||0) - (Number(v.remise)||0);
}
function venteReste(v){
  // Bon non encaissé ne s'applique que s'il y a une assurance (pas "Pas d'assurance")
  const avance = Number(v.avance)||0;
  const bon = (v.assurance && v.assurance !== "Pas d'assurance") ? (Number(v.montantBonNonEncaisse)||0) : 0;
  return Math.max(venteTotal(v) - avance - bon, 0);
}

  // Période par défaut : mois en cours
  if(!f.periode) f.periode = 'mois';
  let debutPeriode = '';
  if(f.periode==='mois') debutPeriode = `${annee}-${String(moisIdx+1).padStart(2,'0')}-01`;

function renderStock(){
  const f = state.filters.stock;
  let rows = DB.stock.filter(s=>{
    if(f.boutique && s.boutique!==f.boutique) return false;
    if(f.categorie && s.categorie!==f.categorie) return false;
    if(f.q && !(s.designation.toLowerCase().includes(f.q.toLowerCase()) || (s.reference||'').toLowerCase().includes(f.q.toLowerCase()))) return false;
    return true;
  }).sort((a,b)=>(a.designation||'').localeCompare(b.designation||''));

  const valeurTotale = rows.reduce((a,x)=>a+(Number(x.quantite)||0)*(Number(x.prixUnitaire)||0),0);

  return `
  <div class="main-head">
    <div><h2>Stock</h2><p>Inventaire par boutique, Patte d'Oie et Tanghin.</p></div>
    <button class="btn-sm" id="btn-new-stock">+ Nouvel article</button>

  <div class="kpi-row">
    <div class="kpi"><div class="lbl">Articles (filtre actif)</div><div class="val">${rows.length}</div></div>
    <div class="kpi"><div class="lbl">Valeur du stock affiché</div><div class="val" style="font-size:22px;">${fmtFCFA(valeurTotale)}</div></div>
    <div class="kpi ${rows.some(x=>Number(x.quantite)<=Number(x.seuilAlerte||0))?'warn':''}"><div class="lbl">Sous le seuil d'alerte</div><div class="val">${rows.filter(x=>Number(x.quantite)<=Number(x.seuilAlerte||0)).length}</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="f-stock-q" placeholder="Rechercher référence ou nom..." value="${escapeHtml(f.q)}">
    <select id="f-stock-boutique">
      <option value="">Toutes les boutiques</option>
      ${BOUTIQUES.map(b=>`<option ${f.boutique===b?'selected':''}>${b}</option>`).join('')}
    </select>
    <select id="f-stock-categorie">
      <option value="">Toutes les catégories</option>
      ${CATEGORIES_STOCK.map(c=>`<option ${f.categorie===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <div class="spacer"></div>
    <button class="btn-sm btn-ghost" id="btn-export-stock">Exporter en CSV</button>
  </div>

  <div class="panel" style="padding:0;">
    <table>
      <thead><tr><th>Référence</th><th>Article</th><th>Catégorie</th><th>Boutique</th><th>Qté</th><th>Prix unit.</th><th>État</th><th></th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(s=>{
          const bas = Number(s.quantite) <= Number(s.seuilAlerte||0);
          return `
          <tr>
            <td>${escapeHtml(s.reference||'—')}</td>
            <td><b>${escapeHtml(s.designation)}</b></td>
            <td>${escapeHtml(s.categorie)}</td>
            <td>${escapeHtml(s.boutique)}</td>
            <td>${s.quantite}</td>
            <td>${fmtFCFA(s.prixUnitaire)}</td>
            <td><span class="badge ${bas?'b-lowstock':'b-okstock'}">${bas?'Stock bas':'OK'}</span></td>
            <td><div class="row-actions">
              <button class="icon-btn" data-edit-stock="${s.id}">Modifier</button>
              ${isAdmin() ? `<button class="icon-btn danger" data-del-stock="${s.id}">Suppr.</button>` : ''}
            </div></td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="8">Aucun article pour ces filtres.</td></tr>`}
      </tbody>
    </table>
  </div>
  `;
}

function renderModal(){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.id = 'modal-backdrop';
  back.innerHTML = `<div class="modal">${modalContent()}</div>`;
  document.getElementById('app').appendChild(back);
  back.addEventListener('click', (e)=>{ if(e.target.id==='modal-backdrop'){ state.modal=null; render(); } });
  attachModalEvents();
  if(state.modal && state.modal.type==='vente') attachVenteConditionalLogic();
}

function modalContent(){
  const m = state.modal;
  if(m.type==='prospect') return prospectForm(m.data);
  if(m.type==='client') return clientForm(m.data);
  if(m.type==='client-from-prospect') return clientForm(m.data, true);
  if(m.type==='client-view') return clientView(m.data);
  if(m.type==='sav') return savForm(m.data);
  if(m.type==='stock') return stockForm(m.data);
  if(m.type==='vente') return venteForm(m.data);
  if(m.type==='ticket') return ticketForm(m.data);
  if(m.type==='apporteur') return apporteurForm(m.data);
  if(m.type==='user') return userForm(m.data);
  if(m.type==='avance') return avanceForm(m.data);
  return '';
}

function clientView(client){
  if(!client) return '<p style="color:#A6402E;">Client introuvable.</p>';
  const telNorm = normTel(client.telephone);
  const tel2Norm = normTel(client.telephone2);
  const telWA = telNorm || tel2Norm;

  // Toutes les ventes de ce client par téléphone normalisé
  const ventesClient = DB.ventes.filter(v=>{
    const vt = normTel(v.telephone);
    if(telNorm && vt && vt===telNorm) return true;
    if(!telNorm || !vt) return (v.nom||'').toLowerCase().trim()===(client.nom||'').toLowerCase().trim();
    return false;
  }).sort((a,b)=>(b.dateMiseEnRelation||'').localeCompare(a.dateMiseEnRelation||''));

  const savClient = DB.sav.filter(s=>{
    const st = normTel(s.telephone);
    if(telNorm && st && st===telNorm) return true;
    return (s.clientNom||'').toLowerCase().trim()===(client.nom||'').toLowerCase().trim();
  }).sort((a,b)=>(b.dateOuverture||'').localeCompare(a.dateOuverture||''));

  const caTotal = ventesClient.reduce((a,v)=>a+venteTotal(v),0);
  const resteTotal = ventesClient.reduce((a,v)=>a+venteReste(v),0);
  const derniereVente = ventesClient[0];
  const premiereVente = ventesClient.length ? ventesClient[ventesClient.length-1] : null;
  const dernPresc = ventesClient.find(v=>v.odSphere||v.ogSphere);

  // Badge ancienneté lunettes
  let badgeRenouvellement = '';
  if(derniereVente && (derniereVente.typeArticle||'').toLowerCase().includes('monture')){
    const mois = Math.floor((new Date()-new Date(derniereVente.dateMiseEnRelation||''))/86400000/30);
    if(mois>=24) badgeRenouvellement = `<span style="background:#A6402E;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;">Renouvellement urgent (${mois} mois)</span>`;
    else if(mois>=18) badgeRenouvellement = `<span style="background:#E8A93B;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;">À relancer (${mois} mois)</span>`;
  }

  return `
  <h3>${client.civilite?escapeHtml(client.civilite)+' ':''}<span style="font-weight:700;">${escapeHtml(client.nom||'')}</span> ${escapeHtml(client.prenom||'')}${badgeRenouvellement}</h3>

    ${tel2Norm?`<span style="font-size:13px;color:#555;">📞 Tel 2 : <b>${escapeHtml(tel2Norm)}</b></span>`:''}

    ${client.boutique?`<span style="font-size:13px;color:#555;">🏪 ${escapeHtml(client.boutique)}</span>`:''}

    ${resteTotal>0?`<div style="background:#fdf0ee;border-radius:8px;padding:12px;text-align:center;">

      <div style="font-size:10px;font-weight:700;color:#68AAD1;text-transform:uppercase;margin-bottom:3px;">Client depuis</div>

    ${savClient.length?`<div style="background:var(--sand-light);border-radius:8px;padding:12px;text-align:center;">
      <div style="font-size:10px;font-weight:700;color:#555;text-transform:uppercase;margin-bottom:3px;">Tickets SAV</div>

function renderAdminComptes(){
  const users = USERS_CACHE;
  const nowM = new Date();
  const moisIdx = nowM.getMonth();
  const annee = nowM.getFullYear();
  const debutMois = `${annee}-${String(moisIdx+1).padStart(2,'0')}-01`;
  const finMois = nowM.toISOString().slice(0,10);
  const debutAnnee = `${annee}-01-01`;

  // Suivi objectifs par commercial
  const commerciaux = users.filter(u=>u.role==='commercial'&&u.actif==='oui');
  const suiviRows = commerciaux.map(u=>{
    let objMensuels = {};
    if(u.objectifsMensuels){ try{ objMensuels = JSON.parse(u.objectifsMensuels); }catch(e){} }
    const objMois = Number(objMensuels[moisIdx])||0;
    const objAnnuel = Number(u.objectifAnnuel)||0;
    const ventes = DB.ventes.filter(v=>v.commercial===u.nom||v.gestionnaire===u.nom);
    const caMois = ventes.filter(v=>{const d=(v.dateMiseEnRelation||'').slice(0,10);return d>=debutMois&&d<=finMois;}).reduce((a,v)=>a+venteTotal(v),0);
    const caAnnee = ventes.filter(v=>{const d=(v.dateMiseEnRelation||'').slice(0,10);return d>=debutAnnee&&d<=finMois;}).reduce((a,v)=>a+venteTotal(v),0);

/* =========================================================
   AUTOCOMPLETE / RECHERCHE INDUCTIVE
   ========================================================= */
function setupAutocomplete(inputId, getSuggestions, onSelect){
  const input = document.getElementById(inputId);
  if(!input) return;
  let box = document.createElement('div');
  box.className = 'autocomplete-box';
  box.style.cssText = 'position:absolute;z-index:200;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.1);min-width:260px;max-height:200px;overflow-y:auto;display:none;';
  input.parentElement.style.position = 'relative';
  input.parentElement.appendChild(box);

  input.addEventListener('input', ()=>{
    const val = input.value.trim();
    if(val.length < 2){ box.style.display='none'; return; }
    const suggestions = getSuggestions(val);
    if(!suggestions.length){ box.style.display='none'; return; }
    box.innerHTML = suggestions.map((s,i)=>`<div class="ac-item" data-idx="${i}" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13.5px;">${s.label}</div>`).join('');
    box.style.display = 'block';
    box.querySelectorAll('.ac-item').forEach((el,i)=>{
      el.addEventListener('mousedown', (e)=>{ e.preventDefault(); onSelect(suggestions[i]); box.style.display='none'; });
      el.addEventListener('mouseover', ()=>el.style.background='var(--sand-light)');
      el.addEventListener('mouseout', ()=>el.style.background='');
    });
  });
  input.addEventListener('blur', ()=>setTimeout(()=>box.style.display='none', 150));
}

function getClientSuggestions(query){
  const q = query.toLowerCase().replace(/\s/g,'');
  const seen = new Set();
  const results = [];
  [...DB.clients, ...DB.ventes].forEach(p=>{
    const name = `${p.nom||''} ${p.prenom||''}`.trim();
    const tel = normTel(p.telephone);
    const tel2 = normTel(p.telephone2);
    const telRaw = String(p.telephone||'');
    const tel2Raw = String(p.telephone2||'');
    if(name.toLowerCase().includes(q) || tel.includes(q) || tel2.includes(q) || telRaw.replace(/\s/g,'').includes(q) || tel2Raw.replace(/\s/g,'').includes(q)){
      const key = tel || name.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      results.push({
        key,
        label: `<b>${escapeHtml(name)}</b> <span style="color:#888;font-size:12px;">${escapeHtml(tel||telRaw)}</span>`,
        nom: p.nom||'', prenom: p.prenom||'',
        telephone: tel||telRaw, telephone2: p.telephone2||'', adresse: p.adresse||'', boutique: p.boutique||p.businessUnit||'', civilite: p.civilite||'', fonction: p.fonction||'', entreprise: p.entreprise||''
      });
    }
  });
  return results.slice(0, 8);
}

   ========================================================= */
function renderJournee(){
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  const tomorrow = new Date(now.getTime()+86400000).toISOString().slice(0,10);
  const hier = new Date(now.getTime()-86400000).toISOString().slice(0,10);

  const nom = state.commercial;
  const heure = now.getHours();
  const salut = heure<12 ? 'Bonjour' : heure<18 ? 'Bon après-midi' : 'Bonsoir';
  const annee = now.getFullYear();
  const moisIdx = now.getMonth();
  const debutMois = `${annee}-${String(moisIdx+1).padStart(2,'0')}-01`;
  const debutAnnee = `${annee}-01-01`;

  // Mes ventes = gestionnaire (porte le CA)
  const mesVentes = isAdmin()
    ? DB.ventes
    : DB.ventes.filter(v=>v.gestionnaire===nom);

  // Ventes boutique = tous les clients de ma boutique (pour les relances)
  const maBoutique = state.boutique;
  const ventesBoutique = maBoutique && maBoutique!=='Toutes'
    ? DB.ventes.filter(v=>v.businessUnit===maBoutique)
    : DB.ventes;

  // Mes tickets assignés non terminés
  if(!DB.tickets || !Array.isArray(DB.tickets)) DB.tickets = [];
  const mesTickets = DB.tickets.filter(t=>t.assigne===nom && t.statut!=='Terminé' && t.type!=='💵 Bulletin de paie');

  // === ANNIVERSAIRES & FIDÉLITÉ ===
  const mmJj = todayISO().slice(5);
  const anneeAct = new Date().getFullYear();
  const PALIERS = [1,2,3,5,10];
  const anniversairesNaissance = [...DB.clients,...DB.prospects].filter(c=>{
    const dob = c.dateNaissance||c.datenaissance||'';
    return dob && dob.slice(5)===mmJj;
  });
  const anniversairesFidelite = [];
  const _fidKeys = new Set();
  DB.ventes.forEach(v=>{
    const d = v.dateMiseEnRelation||''; if(!d) return;
    const ans = anneeAct - Number(d.slice(0,4));
    if(!PALIERS.includes(ans)) return;
    if(d.slice(5)!==mmJj) return;
    const key=(v.telephone||'')+v.nom;
    if(_fidKeys.has(key)) return;
    _fidKeys.add(key);
    anniversairesFidelite.push({...v, anneesEcoulees:ans});
  });
  const mesTicketsPaie = DB.tickets.filter(t=>t.assigne===nom && t.type==='💵 Bulletin de paie' && t.statut!=='Terminé');
  const ticketsLabo = isAdmin() ? DB.tickets.filter(t=>t.type==='🔬 Commande labo' && t.statut==='À faire') : [];

  // Mes prospects

function renderTickets(){
  const f = state.filters.tickets || {};
  if(!state.filters.tickets) state.filters.tickets = {q:'',statut:'',type:'',assigne:''};
  const moi = state.commercial;
  if(!DB.tickets || !Array.isArray(DB.tickets)) DB.tickets = [];
  if(!state.pages) state.pages={clients:1,prospects:1,ventes:1,tickets:1};
  const PS_TK = 5;

  // Admin voit tout, commercial voit ses tickets + ceux de sa boutique
  let rowsAll = DB.tickets.filter(t=>{
    // Tickets de paie : visible uniquement par l'assigné et la directrice
    if(t.type==='💵 Bulletin de paie' && !isAdmin() && t.assigne!==moi) return false;
    if(!isAdmin() && t.type!=='💵 Bulletin de paie' && t.assigne!==moi && t.boutique!==state.boutique) return false;
    if(!isAdmin() && t.type==='💵 Bulletin de paie') return t.assigne===moi; // Seulement les siens
    if(f.statut && t.statut!==f.statut) return false;
    if(f.type && t.type!==f.type) return false;
    if(f.assigne && t.assigne!==f.assigne) return false;
    if(f.q){ const q=f.q.toLowerCase(); if(!`${t.titre} ${t.clientNom||''} ${t.description||''}`.toLowerCase().includes(q)) return false; }
    return true;
  }).sort((a,b)=>{
    // Priorité haute en premier, puis date
    const prio = {Haute:0,Normale:1,Basse:2};
    if(a.priorite!==b.priorite) return (prio[a.priorite]||1)-(prio[b.priorite]||1);
    return (b.dateCreation||'').localeCompare(a.dateCreation||'');
  });
  const totalTk = rowsAll.length;
  const pageTk = Math.min(state.pages.tickets||1, Math.ceil(totalTk/PS_TK)||1);
  state.pages.tickets = pageTk;
  const rows = rowsAll.slice((pageTk-1)*PS_TK, pageTk*PS_TK);

  const mesTickets = rows.filter(t=>t.assigne===moi && t.statut!=='Terminé');
  const ticketsLabo = rows.filter(t=>t.type==='🔬 Commande labo' && t.statut!=='Terminé');

  function badgePrio(p){ const c={Haute:'#A6402E',Normale:'#E8A93B',Basse:'#888'}[p]||'#888'; return `<span style="background:${c};color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;">${p||'—'}</span>`; }
  function badgeStatut(s){ const c={'À faire':'#68AAD1','En cours':'#E8A93B','En attente':'#9b59b6','Terminé':'#2d7a3a'}[s]||'#888'; return `<span style="background:${c};color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;">${s}</span>`; }
  function badgeType(t){ return `<span style="font-size:12px;">${t||'—'}</span>`; }

  return `
  <div class="main-head">
    <div><h2>🎫 Tickets</h2><p>${isAdmin()?'Toutes les tâches en cours':'Mes tâches et celles de ma boutique'} · <b>${totalTk} ticket(s)</b></p></div>
    <button class="btn-sm" id="btn-new-ticket">+ Nouveau ticket</button>
  </div>

  ${isAdmin() && ticketsLabo.length ? `
  <div class="panel" style="border-left:4px solid #A6402E;">
    <h3 style="color:#A6402E;margin-bottom:10px;">🔬 Commandes labo en attente (${ticketsLabo.length})</h3>
    ${ticketsLabo.slice(0,3).map(t=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;">
      <div>
        <b>${escapeHtml(t.titre)}</b>
        <span style="font-size:11px;color:#888;margin-left:8px;">${escapeHtml(t.clientNom||'')} · ${fmtDate(t.dateCreation)} · ${escapeHtml(t.labo||'')}</span>
        ${t.description?`<div style="font-size:11px;color:#666;margin-top:2px;">${escapeHtml(t.description.slice(0,80))}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;">
        ${badgePrio(t.priorite)}
        <button class="icon-btn" data-edit-ticket="${t.id}">Traiter →</button>
      </div>
    </div>`).join('')}
    ${ticketsLabo.length>3?`<p style="font-size:12px;color:#E8A93B;margin-top:8px;">+${ticketsLabo.length-3} autres → <button onclick="state.teamTab='tickets';render();" style="background:none;border:none;color:#E8A93B;cursor:pointer;font-weight:600;text-decoration:underline;">Voir les tickets</button></p>`:''}
  </div>` : ''}

  <div class="toolbar">
    <input type="text" id="f-ticket-q" placeholder="Rechercher..." value="${escapeHtml(f.q||'')}">
    <select id="f-ticket-statut">
      <option value="">Tous les statuts</option>
      ${STATUTS_TICKET.map(s=>`<option ${f.statut===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <select id="f-ticket-type">
      <option value="">Tous les types</option>
      ${TYPES_TICKET.map(s=>`<option ${f.type===s?'selected':''}>${s}</option>`).join('')}
    </select>
    ${isAdmin()?`<select id="f-ticket-assigne">
      <option value="">Tous</option>
      ${STAFF_ALL.map(s=>`<option ${f.assigne===s?'selected':''}>${s}</option>`).join('')}
    </select>`:''}
  </div>

  <div class="panel" style="padding:0;">
    <table>
      <thead><tr><th>Type</th><th>Titre</th><th>Client</th><th>Assigné à</th><th>Priorité</th><th>Statut</th><th>Date</th><th></th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(t=>`
        <tr style="${t.statut==='Terminé'?'opacity:.5;':''}">
          <td>${badgeType(t.type)}</td>
          <td><b>${escapeHtml(t.titre)}</b>${t.description?`<div style="font-size:11px;color:#888;">${escapeHtml(t.description.slice(0,50))}${t.description.length>30?'…':''}</div>`:''}</td>
          <td style="font-size:12px;">
            <b>${escapeHtml(t.clientNom||'—')}</b>
            ${t.clientPrenom?`<span style="color:#888;"> ${escapeHtml(t.clientPrenom)}</span>`:''}
            ${t.clientTel?`<div style="font-size:11px;color:#555;">📱 ${escapeHtml(t.clientTel)}${t.clientTel2?` · 📞 ${escapeHtml(t.clientTel2)}`:''}</div>`:''}
            ${t.clientTel||t.clientTel2?`<a href="https://wa.me/${(()=>{const tel=String(t.clientTel||t.clientTel2||''); return tel.startsWith('226')?tel:'226'+tel;})()}?text=${encodeURIComponent(bonjourClient(t.clientNom,t.clientPrenom||'',t.clientCivilite||'')+', nous vous contactons de Jéricho Optique concernant votre commande.')}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;background:#25D366;color:#fff;text-decoration:none;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;margin-top:3px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.188 8.188 0 0 1-1.26-4.38c.01-4.54 3.7-8.24 8.25-8.24M8.53 7.33c-.16 0-.43.06-.66.31-.22.25-.87.86-.87 2.07 0 1.22.89 2.39 1 2.56.14.17 1.76 2.67 4.25 3.73.59.27 1.05.42 1.41.53.59.19 1.13.16 1.56.1.48-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.07-.11-.25-.17-.53-.31-.28-.14-1.66-.82-1.92-.91-.26-.09-.44-.14-.63.14-.19.28-.72.91-.88 1.09-.16.18-.32.2-.6.07-.28-.14-1.19-.44-2.26-1.4-.83-.75-1.4-1.67-1.56-1.95-.17-.28-.02-.44.12-.58.13-.13.28-.34.42-.51.14-.17.18-.29.28-.47.09-.19.05-.35-.02-.49-.07-.14-.63-1.52-.88-2.07-.24-.53-.48-.46-.66-.47-.16-.01-.35-.01-.53-.01Z"/></svg> WA</a>`:''}</td>
          <td><b>${escapeHtml(t.assigne||'—')}</b>${t.creepar?`<div style="font-size:10px;color:#aaa;">par ${escapeHtml(t.creepar)}</div>`:''}</td>
          <td>${badgePrio(t.priorite)}</td>
          <td>
            ${t.type==='💵 Bulletin de paie'
              ? `<div style="background:#FFF9EF;border:1px solid #E8A93B;border-radius:6px;padding:6px 10px;font-size:11px;white-space:pre-line;max-width:260px;">${escapeHtml((t.description||'').slice(0,200))}${(t.description||'').length>200?'…':''}</div>`
              : badgeStatut(t.statut)}
          </td>
          <td style="font-size:11px;color:#888;">${fmtDate(t.dateCreation)}${t.dateLimite?`<br><span style="color:#A6402E;">⏰ ${fmtDate(t.dateLimite)}</span>`:''}</td>
          <td><div class="row-actions">
            <button class="icon-btn" data-edit-ticket="${t.id}">Modifier</button>
            ${t.type==="💰 Demande d'avance" && isAdmin() && t.statut!=='Terminé' ? `<button class="btn-sm" style="font-size:11px;background:#E8A93B;margin-left:4px;" data-traiter-avance="${t.id}">💰 Traiter</button>` : ''}
            ${isAdmin()?`<button class="icon-btn danger" data-del-ticket="${t.id}">Suppr.</button>`:''}
          </div></td>
        </tr>`).join('')
        : `<tr class="empty-row"><td colspan="8">Aucun ticket. Créez-en un avec "+ Nouveau ticket".</td></tr>`}
      </tbody>
    </table>
  </div>
  ${renderPagination('tickets', totalTk, pageTk, PS_TK)}`;
}

// Types de tickets dont l'assigné est toujours Directrice (non modifiable sauf admin)
const TICKETS_DIRECTRICE = ["💰 Demande d'avance", '💵 Bulletin de paie', '🔬 Commande labo'];

function assigneField(type, currentAssigne){
  // Toujours Directrice, non modifiable
  if(type === "💰 Demande d'avance"){
    return `<input id="tk-assigne-display" value="Directrice" readonly style="background:#f5f4f0;color:#888;cursor:not-allowed;"><input type="hidden" id="tk-assigne" value="Directrice">`;
  }
  // Directrice forcée, admin peut changer
  if(TICKETS_DIRECTRICE.includes(type)){
    if(isAdmin()){
      return `<select required id="tk-assigne">${STAFF_ALL.map(s=>`<option ${(currentAssigne||'Directrice')===s?'selected':''}>${s}</option>`).join('')}</select>`;
    }
    return `<input id="tk-assigne-display" value="Directrice" readonly style="background:#f5f4f0;color:#888;cursor:not-allowed;"><input type="hidden" id="tk-assigne" value="Directrice">`;
  }
  // Tickets libres : tout le monde peut choisir l'assigné
  return `<select required id="tk-assigne">${STAFF_ALL.map(s=>`<option ${(currentAssigne||state.commercial)===s?'selected':''}>${s}</option>`).join('')}</select>`;
}

// Recherche client par nom ou numéro dans le ticket
window.tkSearchClient = function(val){
  const res = document.getElementById('tk-search-results');
  if(!res) return;
  if(val.length < 2){ res.style.display='none'; return; }

  const q = val.toLowerCase().replace(/\s/g,'');
  // Chercher dans l'index client (nom + tel)
  const seen = new Set();
  const matches = [];
  DB.ventes.forEach(v=>{
    const nom = `${v.nom||''} ${v.prenom||''}`.trim();
    const tel = normTel(v.telephone||'');
    const key = tel || nom.toLowerCase();
    if(seen.has(key)) return;
    if(nom.toLowerCase().replace(/\s/g,'').includes(q) || tel.includes(q)){
      seen.add(key);
      matches.push({nom:v.nom||'', prenom:v.prenom||'', civilite:v.civilite||'', telephone:v.telephone||'', telephone2:v.telephone2||''});
    }
  });

  if(!matches.length){ res.style.display='none'; return; }

  res.innerHTML = matches.slice(0,8).map((m,i)=>`
    <div onclick="tkFillClient(window._tkMatches[${i}])"
      style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;"
      onmouseover="this.style.background='#FFF9EF'" onmouseout="this.style.background=''">
      <b>${escapeHtml(m.civilite?m.civilite+' ':'')}${escapeHtml(m.nom)} ${escapeHtml(m.prenom)}</b>
      <span style="color:#888;font-size:11px;margin-left:8px;">📱 ${escapeHtml(normTel(m.telephone)||'—')}</span>
    </div>`).join('');
  window._tkMatches = matches.slice(0,8);
  res.style.display='block';
};

// Détection unifocal/progressif selon les additions
function isProgressif(vente){
  const odAdd = parseFloat(String(vente.odAddition||'0').replace(',','.').replace('+','')) || 0;
  const ogAdd = parseFloat(String(vente.ogAddition||'0').replace(',','.').replace('+','')) || 0;
  return Math.abs(odAdd) > 0.1 || Math.abs(ogAdd) > 0.1;
}

// Calcul prime monture par vente
function primeMontureParVente(prixMont){
  const p = Number(prixMont)||0;
  if(p < 25000) return 0;
  if(p <= 40000) return 1500;
  if(p <= 65000) return 3000;
  if(p <= 120000) return 5000;
  return 8000;
}

// Calcul prime lentilles progressif (forfait par vente selon CA mensuel)
function primeLentillesProgressif(caMensuelLentProg, nbVentes, objectifMensuel){
  if(caMensuelLentProg <= 0 || nbVentes <= 0) return 0;
  const obj = Number(objectifMensuel)||1800000;
  let forfait;
  if(caMensuelLentProg > obj) return Math.round(caMensuelLentProg * 0.09);
  if(caMensuelLentProg > 900000) forfait = 9000;
  else if(caMensuelLentProg > 480000) forfait = 7000;
  else if(caMensuelLentProg >= 300000) forfait = 6000;
  else return 0;
  return forfait * nbVentes;
}

// Calcul prime lentilles unifocal
function primeLentillesUnifocal(caMensuelLentUnif, nbVentes, objectifMensuel){
  if(caMensuelLentUnif <= 0 || nbVentes <= 0) return 0;
  const obj = Number(objectifMensuel)||1200000;
  let forfait;
  if(caMensuelLentUnif > obj) return Math.round(caMensuelLentUnif * 0.08);
  if(caMensuelLentUnif > 700000) forfait = 6000;
  else if(caMensuelLentUnif > 400000) forfait = 4000;
  else if(caMensuelLentUnif >= 240000) forfait = 3000;
  else return 0;
  return forfait * nbVentes;
}

// Calcul prime totale d'un commercial pour un mois donné
function calculPrimeMensuelle(nomCommercial, annee, mois, utilisateur){
  // Comparaison en string ISO — évite les problèmes de fuseau horaire
  const mm = String(mois+1).padStart(2,'0');
  const lastDay = new Date(annee, mois+1, 0).getDate();
  const debutMois = `${annee}-${mm}-01`;
  const finMois   = `${annee}-${mm}-${String(lastDay).padStart(2,'0')}`;

  // Normaliser une date en string ISO YYYY-MM-DD
  function normDate(d){
    if(!d) return '';
    const s = String(d).trim().slice(0,10);
    // Format ISO : 2024-08-31 → OK
    if(s.match(/^\d{4}-\d{2}-\d{2}$/)) return s;
    // Format DD/MM/YYYY : 31/08/2024 → 2024-08-31
    if(s.match(/^\d{2}\/\d{2}\/\d{4}$/)){
      const [dd,mm2,yyyy] = s.split('/');
      return `${yyyy}-${mm2}-${dd}`;
    }
    return s;
  }

  // Date de début du système de primes (configurable)
  const DEBUT_PRIMES = '2026-09-01';

  // Toutes les ventes du mois (montures + lentilles, pas accessoires/réparations)
  const nomLower = nomCommercial.toLowerCase().trim();
  const ventesCommercial = DB.ventes.filter(v => {
    if((v.gestionnaire||'').toLowerCase().trim() !== nomLower) return false;
    const d = normDate(v.dateMiseEnRelation);
    if(!d || d < debutMois || d > finMois) return false;
    if(d < DEBUT_PRIMES) return false; // Exclure ventes avant le système de primes
    const type = (v.typeArticle||'').toLowerCase();
    return type.includes('monture') || type.includes('lentille');
  });

  // Objectif mensuel du commercial
  let objMensuels = {};
  try{ objMensuels = JSON.parse(utilisateur?.objectifsMensuels||'{}'); }catch(e){}
  const objMois = Number(objMensuels[mois]||utilisateur?.objectifAnnuel/12||0);

  let caProg=0, nbProg=0, caUnif=0, nbUnif=0, primeMont=0;
  let detailProg=[], detailUnif=[];

  ventesCommercial.forEach(v => {
    const type = (v.typeArticle||'').toLowerCase();
    const isMonture = type.includes('monture'); // Monture/Verres correcteurs
    const isLentilles = type.includes('lentille'); // Lentilles de contact

    const remise = Number(v.remise||0);

    // === PRIME MONTURE ===
    // Pour une vente Monture/Verres : prime sur le prix de la monture seule
    // Pour une vente Lentilles : pas de prime monture
    const mont = Number(v.prixVenteMonture||0);
    if(isMonture && mont >= 10000){
      const montNet = Math.max(mont - remise*0.5, 0);
      primeMont += primeMontureParVente(montNet);
    }

    // === PRIME LENTILLES ===
    // Pour Monture/Verres : les "lentilles" = verres correcteurs (prixVenteLentilles ou prixVenteMonture selon saisie)
    // Pour Lentilles de contact : prixVenteLentilles = lentilles de contact
    let prixLentCA = 0;
    if(isMonture){
      // CA lentilles = prix des VERRES (prixVenteLentilles dans une vente monture)
      prixLentCA = Number(v.prixVenteLentilles||0);
    } else if(isLentilles){
      // CA lentilles = prix des lentilles de contact
      prixLentCA = Number(v.prixVenteLentilles||0);
    }

    if(prixLentCA < 10000) return; // Pas de prime si verres/lentilles < 10k
    const lentNet = Math.max(prixLentCA - remise*0.5, 0);

    const prog = isProgressif(v);
    if(prog){
      caProg += lentNet;
      nbProg++;
      detailProg.push({nom:v.nom||'', date:v.dateMiseEnRelation, lent:lentNet, mont:mont>=10000?Math.max(mont-remise*0.5,0):0, od:v.odAddition, og:v.ogAddition, type:isMonture?'Monture':'Lentilles'});
    } else {
      caUnif += lentNet;
      nbUnif++;
      detailUnif.push({nom:v.nom||'', date:v.dateMiseEnRelation, lent:lentNet, mont:mont>=10000?Math.max(mont-remise*0.5,0):0, type:isMonture?'Monture':'Lentilles'});
    }
  });

  const primeProg = primeLentillesProgressif(caProg, nbProg, objMois);
  const primeUnif = primeLentillesUnifocal(caUnif, nbUnif, objMois);
  const primeBrute = primeProg + primeUnif + primeMont;

  // Impayés du commercial ce mois
  const impayes = ventesCommercial
    .filter(v => Number(v.avance||0) < (Number(v.prixVenteTotalSansRemise||0) - Number(v.remise||0)))
    .reduce((s,v) => {
      const total = Number(v.prixVenteTotalSansRemise||0) - Number(v.remise||0);
      const avance = Number(v.avance||0);
      const bon = Number(v.montantBonNonEncaisse||0);
      return s + Math.max(total - avance - bon, 0);
    }, 0);

  // Retenue 30% si impayés
  const retenue = impayes > 0 ? Math.round(primeBrute * 0.30) : 0;
  const primeNette = primeBrute - retenue;

  return {
    nomCommercial, annee, mois,
    caProg, nbProg, primeProg,
    caUnif, nbUnif, primeUnif,
    primeMont,
    primeBrute, impayes, retenue, primeNette,
    objMois, detailProg, detailUnif,
    nbVentesTotales: ventesCommercial.length
  };
}

function totalAvancesMois(commercial, moisStr){
  // Somme des échéances dues ce mois
  return DB.avances
    .filter(a => (a.commercial||'').toLowerCase() === commercial.toLowerCase())
    .reduce((sum, a) => {
      try {
        const echeances = JSON.parse(a.echeances||'[]');
        const due = echeances.find(e => e.mois === moisStr);
        return sum + (due ? Number(due.montant||0) : 0);
      } catch(e){ return sum; }
    }, 0);
}

function renderPaie(){

// Sauvegarder un bulletin de paie
async function sauvegarderBulletin(userId, nom, moisStr, solder){
  const user = USERS_ALL_CACHE.find(x=>x.id===userId) || USERS_CACHE.find(x=>x.id===userId);
  const moisAff = state.primesMois !== undefined ? state.primesMois : new Date().getMonth();
  const anneeAff = state.primesAnnee || new Date().getFullYear();
  const p = calculPrimeMensuelle(nom, anneeAff, moisAff, user);

  const prime70 = Math.round(p.primeBrute * 0.70);
  const prime30 = p.primeBrute - prime70;
  const lib30 = Number(document.getElementById(`lib30-${userId}`)?.value||0);
  const avancesSupp = Number(document.getElementById(`av-${userId}`)?.value||0);
  const notes = document.getElementById(`note-${userId}`)?.value||'';
  const salaire = Number(user?.salaireBase||0);
  const avancesMois = totalAvancesMois(nom, moisStr);
  const totalAvances = avancesMois + avancesSupp;
  const netAPayer = Math.max(salaire + prime70 - totalAvances, 0);

  const existing = getBulletin(nom, moisStr);
  const bulletin = {
    id: existing?.id || `paie_${nom}_${moisStr}_${Date.now()}`,
    commercial: nom,
    mois: moisStr,
    salaireBase: salaire,
    primeBrute: p.primeBrute,
    prime70, prime30,
    prime30Libere: lib30,
    avances: avancesSupp,
    totalAvances,
    netAPayer,
    impayes: p.impayes,
    notes,
    statut: solder ? 'solde' : (existing?.statut||'en_attente'),
    dateValidation: solder ? todayISO() : (existing?.dateValidation||''),
  };

  try{
    await apiUpsert('paie', bulletin);
    if(existing){
      DB.paie = DB.paie.map(b=>b.id===bulletin.id?bulletin:b);
    } else {
      DB.paie.push(bulletin);
    }
    render();

    // Créer ticket de paie si on solde
    if(solder){
      const MOIS_NOM = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
      const [anneeT, moisT] = moisStr.split('-');
      const moisNom = MOIS_NOM[Number(moisT)-1] + ' ' + anneeT;
      const ticketPaie = {
        id: 'tk_paie_'+nom+'_'+moisStr+'_'+Date.now(),
        type: '💵 Bulletin de paie',
        titre: `Paie ${moisNom} — ${nom}`,
        description: [
          `Salaire de base : ${fmtFCFA(bulletin.salaireBase||0)}`,
          `Prime brute : ${fmtFCFA(bulletin.primeBrute||0)}`,
          `  dont 70% versé : ${fmtFCFA(bulletin.prime70||0)}`,
          `  dont 30% retenu : ${fmtFCFA(bulletin.prime30||0)}`,
          bulletin.prime30Libere > 0 ? `  30% libéré : ${fmtFCFA(bulletin.prime30Libere||0)}` : '',
          bulletin.totalAvances > 0 ? `Avances déduites : −${fmtFCFA(bulletin.totalAvances||0)}` : '',
          `━━━━━━━━━━━━━━━━━━━━`,
          `NET À PAYER : ${fmtFCFA(bulletin.netAPayer||0)}`,
          bulletin.notes ? ('Note : ' + bulletin.notes) : '',
        ].filter(Boolean).join('\n'),
        assigne: nom,
        priorite: 'Normale',
        statut: 'À faire',
        clientNom: '',
        clientTel: '',
        clientTel2: '',
        clientCivilite: '',
        clientPrenom: '',
        labo: '',
        boutique: 'Toutes',
        dateCreation: todayISO(),
        dateLimite: '',
        venteId: '',
        creepar: state.commercial,
      avanceMontant: document.getElementById('tk-avance-montant')?.value||'',
      avanceDuree: document.getElementById('tk-avance-duree')?.value||'',
      avanceDebut: document.getElementById('tk-avance-debut')?.value||'',
      avanceMotif: document.getElementById('tk-avance-motif')?.value||'',
      };
      try{
        await apiUpsert('tickets', ticketPaie);
        if(!Array.isArray(DB.tickets)) DB.tickets = [];
        DB.tickets.unshift(ticketPaie);
      }catch(e){ console.warn('Ticket paie non créé:', e); }
    }

    showToast(solder ? `✅ Paie de ${nom} soldée. Ticket envoyé.` : `Bulletin de ${nom} enregistré.`);
  }catch(e){
    showToast('Erreur de sauvegarde — vérifiez la feuille Paie dans Sheets.');
  }
}

function renderPrimes(){
  const now = new Date();
  const moisCourant = now.getMonth();
  const anneeCourante = now.getFullYear();
  const moisAff = state.primesMois !== undefined ? state.primesMois : moisCourant;
  const anneeAff = state.primesAnnee || anneeCourante;

  // Trouver l'utilisateur courant
  const user = USERS_CACHE.find(u => u.id === state.userId || u.nom === state.commercial);

  if(isAdmin()){
    return renderPrimesAdmin(anneeAff, moisAff);

    return renderPrimesCommercial(state.commercial, anneeAff, moisAff, user);

function renderPrimesCommercial(nom, annee, mois, user){
  const p = calculPrimeMensuelle(nom, annee, mois, user);
  const MOIS_NOM = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

  // Barre progression prime brute vs objectif
  const pctProg = p.objMois > 0 ? Math.min(Math.round(p.caProg/p.objMois*100),100) : 0;
  const pctUnif = p.objMois > 0 ? Math.min(Math.round(p.caUnif/p.objMois*100),100) : 0;

  // Palier actuel progressif
  function palierProg(ca){
    if(ca >= 900000) return {label:'Palier 3 — 9 000 FCFA/vente', color:'#2d7a3a'};
    if(ca >= 480000) return {label:'Palier 2 — 7 000 FCFA/vente', color:'#E8A93B'};
    if(ca >= 300000) return {label:'Palier 1 — 6 000 FCFA/vente', color:'#68AAD1'};
    return {label:'Sous le seuil (min. 300 000 FCFA)', color:'#ccc'};
  }
  function palierUnif(ca){
    if(ca >= 700000) return {label:'Palier 3 — 6 000 FCFA/vente', color:'#2d7a3a'};
    if(ca >= 400000) return {label:'Palier 2 — 4 000 FCFA/vente', color:'#E8A93B'};
    if(ca >= 240000) return {label:'Palier 1 — 3 000 FCFA/vente', color:'#68AAD1'};
    return {label:'Sous le seuil (min. 240 000 FCFA)', color:'#ccc'};
  }

  const pp = palierProg(p.caProg);
  const pu = palierUnif(p.caUnif);

  return `
  <div class="main-head">
    <div><h2>💰 Mes primes</h2><p>Calcul en temps réel — ${MOIS_NOM[mois]} ${annee}</p></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <select onchange="state.primesMois=Number(this.value);render();" style="padding:6px;border-radius:6px;border:1px solid #ddd;">
        ${MOIS_NOM.map((m,i)=>`<option value="${i}" ${i===mois?'selected':''}>${m}</option>`).join('')}
      </select>
      <select onchange="state.primesAnnee=Number(this.value);render();" style="padding:6px;border-radius:6px;border:1px solid #ddd;">
        ${[annee-1,annee].map(a=>`<option value="${a}" ${a===annee?'selected':''}>${a}</option>`).join('')}
      </select>
    </div>
  </div>

  <!-- RÉSUMÉ PRIME -->
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px;">
    <div class="kpi" style="text-align:center;">
      <div class="lbl">Prime lentilles progressif</div>
      <div class="val" style="font-size:20px;color:#E8A93B;">${fmtFCFA(p.primeProg)}</div>
      <div class="sub">${p.nbProg} vente(s) · ${fmtFCFA(p.caProg)} CA</div>
    </div>
    <div class="kpi" style="text-align:center;">

// Détecter et supprimer les doublons de ventes
async function detecterDoublons(){
  // Deux ventes = doublon si même gestionnaire + même téléphone + même date + même total
  const seen = new Map();
  const doublons = [];

  // Trier par date pour garder la première occurrence
  const ventesTriees = [...DB.ventes].sort((a,b)=>(a.dateMiseEnRelation||'').localeCompare(b.dateMiseEnRelation||''));

  ventesTriees.forEach(v => {
    const tel = normTel(v.telephone||'');
    const date = (v.dateMiseEnRelation||'').slice(0,10);
    const total = String(v.prixVenteTotalSansRemise||'');
    const type = v.typeArticle||'';
    const key = `${v.gestionnaire}|${tel}|${date}|${total}|${type}`;
    if(seen.has(key)){
      doublons.push(v); // Doublon — à supprimer
    } else {
      seen.set(key, v.id);
    }
  });

  if(doublons.length === 0){
    showToast('✅ Aucun doublon détecté dans les ventes.');
    return;
  }

  const msg = `${doublons.length} doublon(s) détecté(s).\n\nExemples :\n${doublons.slice(0,3).map(v=>`• ${v.nom||''} ${v.prenom||''} — ${v.dateMiseEnRelation||''} — ${v.prixVenteTotalSansRemise||''} FCFA`).join('\n')}\n\nSupprimer ces doublons ?`;

  let _confirmed = false; await new Promise(res=>showConfirm(msg, ()=>{_confirmed=true;res();})); if(!_confirmed) return;

  showToast('Suppression en cours...');
  let supprimés = 0;
  for(const v of doublons){
    try{
      await apiDelete('ventes', v.id);
      DB.ventes = DB.ventes.filter(x=>x.id!==v.id);
      supprimés++;
    }catch(e){ /* continuer */ }
  }
  _clientIndexCache = null; // Invalider le cache
  render();
  showToast(`✅ ${supprimés} doublon(s) supprimé(s). Données nettoyées.`);
}


async function updateSalaireBase(userId, valeur){
  let u = USERS_ALL_CACHE.find(x=>x.id===userId) || USERS_CACHE.find(x=>x.id===userId);
  if(!u){ showToast('Utilisateur introuvable.'); return; }
  u.salaireBase = String(valeur||'');
  // Sync dans les deux caches
  const idxAll = USERS_ALL_CACHE.findIndex(x=>x.id===userId);
  if(idxAll>=0) USERS_ALL_CACHE[idxAll].salaireBase = u.salaireBase;
  const idxActif = USERS_CACHE.findIndex(x=>x.id===userId);
  if(idxActif>=0) USERS_CACHE[idxActif].salaireBase = u.salaireBase;
  try{
    // Utiliser saveUser (endpoint Utilisateurs avec majuscule)
    await saveUser(u);
    showToast(`Salaire de ${u.nom||userId} mis à jour.`);
  }catch(e){
    showToast('Erreur — vérifiez la connexion.');
  }
}

// Composant pagination réutilisable
function renderPagination(table, total, current, pageSize=10) {
  if(total <= pageSize) return '';
  const nbPages = Math.ceil(total / pageSize);
  const maxVisible = 7;
  let pages = [];

  if(nbPages <= maxVisible) {
    for(let i=1; i<=nbPages; i++) pages.push(i);
  } else {
    pages = [1];
    let start = Math.max(2, current-2);
    let end = Math.min(nbPages-1, current+2);
    if(start > 2) pages.push('...');
    for(let i=start; i<=end; i++) pages.push(i);
    if(end < nbPages-1) pages.push('...');
    pages.push(nbPages);
  }

  return '<div style="display:flex;align-items:center;gap:4px;justify-content:center;padding:16px 0;flex-wrap:wrap;">'
    + '<span style="font-size:12px;color:#888;margin-right:8px;">' + total + ' résultats</span>'
    + (current > 1 ? '<button onclick="state.pages.'+table+'='+(current-1)+';render();" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;">‹</button>' : '')
    + pages.map(p => p === '...'
        ? '<span style="padding:4px 2px;color:#888;">…</span>'
        : '<button onclick="state.pages.'+table+'='+p+';render();" style="padding:6px 10px;border:1px solid '+(p===current?'#E8A93B':'#ddd')+';border-radius:6px;background:'+(p===current?'#E8A93B':'#fff')+';color:'+(p===current?'#fff':'#333')+';cursor:pointer;font-size:13px;font-weight:'+(p===current?'700':'400')+';">'+p+'</button>'
      ).join('')
    + (current < nbPages ? '<button onclick="state.pages.'+table+'='+(current+1)+';render();" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;">›</button>' : '')
    + '</div>';
}

function renderAnalyse(){
  const periode = state.analysePeriode || 'mois';
  const dateDebut = state.analyseDebut || '';
  const dateFin = state.analyseFin || '';

  // Calcul des bornes de dates
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  function startOf(p){
    if(p==='jour') return today;
    if(p==='semaine'){
      const d = new Date(now);
      d.setDate(d.getDate() - d.getDay() + (d.getDay()===0?-6:1));
      return d.toISOString().slice(0,10);
    }
    if(p==='mois') return today.slice(0,7)+'-01';
    if(p==='annee') return today.slice(0,4)+'-01-01';
    if(p==='custom') return dateDebut;
    return today.slice(0,7)+'-01';
  }
  const debut = startOf(periode);
  const fin = periode==='custom' ? dateFin : today;

  // Filtre par commercial si non admin
  const mesVentes = isAdmin()
    ? DB.ventes
    : DB.ventes.filter(v=>v.gestionnaire===state.commercial); // CA = gestionnaire
  const mesProspects = isAdmin()
    ? DB.prospects
    : DB.prospects.filter(p=>p.commercial===state.commercial);

  // Ventes de la période
  const ventesP = mesVentes.filter(v=>{
    const d = (v.dateMiseEnRelation||'').slice(0,10);
    return d>=debut && d<=fin;
  });
  // Période précédente (même durée)
  const dureeMs = new Date(fin) - new Date(debut);
  const debutPrec = new Date(new Date(debut)-dureeMs-86400000).toISOString().slice(0,10);
  const finPrec = new Date(new Date(debut)-86400000).toISOString().slice(0,10);
  const ventesPrec = mesVentes.filter(v=>{
    const d=(v.dateMiseEnRelation||'').slice(0,10);
    return d>=debutPrec && d<=finPrec;
  });

  // KPIs principaux
  const ca = ventesP.reduce((a,v)=>a+venteTotal(v),0);
  const caPrec = ventesPrec.reduce((a,v)=>a+venteTotal(v),0);
  const evolCa = caPrec>0 ? Math.round((ca-caPrec)/caPrec*100) : null;
  const nb = ventesP.length;
  const nbPrec = ventesPrec.length;
  const panier = nb>0 ? Math.round(ca/nb) : 0;
  const reste = ventesP.reduce((a,v)=>a+venteReste(v),0);
  const prospP = mesProspects.filter(p=>{const d=(p.dateMiseEnRelation||'').slice(0,10);return d>=debut&&d<=fin;});
  const convertisP = prospP.filter(p=>p.statut==='Converti en client').length;
  const txConv = prospP.length>0?Math.round(convertisP/prospP.length*100):0;
  const bonTotal = ventesP.filter(v=>v.assurance&&v.assurance!=="Pas d'assurance").reduce((a,v)=>a+(Number(v.montantBonNonEncaisse)||0),0);

  // CA par type
  const parType = {};
  ventesP.forEach(v=>{const t=v.typeArticle||'Autre'; parType[t]=(parType[t]||0)+venteTotal(v);});
  const typesOrder = Object.entries(parType).sort((a,b)=>b[1]-a[1]);

  // CA par boutique
  const parBoutique = {};
  ventesP.forEach(v=>{const b=v.businessUnit||'?'; parBoutique[b]=(parBoutique[b]||0)+venteTotal(v);});

  // CA par jour (graphe linéaire)
  const jours = {};
  ventesP.forEach(v=>{const d=(v.dateMiseEnRelation||'').slice(0,10); jours[d]=(jours[d]||0)+venteTotal(v);});
  const joursArr = Object.entries(jours).sort((a,b)=>a[0].localeCompare(b[0]));

  // CA par commercial (admin seulement)
  const parCommercial = {};
  if(isAdmin()){
    DB.ventes.filter(v=>{const d=(v.dateMiseEnRelation||'').slice(0,10);return d>=debut&&d<=fin;})
      .forEach(v=>{const c=v.commercial||v.gestionnaire||'?'; parCommercial[c]=(parCommercial[c]||0)+venteTotal(v);});
  }

  // Assurances
  const avecAss = ventesP.filter(v=>v.assurance&&v.assurance!=="Pas d'assurance").length;
  const sansAss = ventesP.length - avecAss;

  // Graphe barres CA par jour
  function svgBarres(data, couleur='#E8A93B'){
    if(!data.length) return '<p style="color:#9a998f;font-style:italic;font-size:13px;">Pas encore de données sur cette période.</p>';
    const max = Math.max(...data.map(d=>d[1]),1);
    const W=520, H=160, padL=10, padR=10, padT=10, padB=30;
    const bw = Math.max(4, Math.floor((W-padL-padR)/data.length)-2);
    const bars = data.map((d,i)=>{
      const x = padL + i*((W-padL-padR)/data.length) + ((W-padL-padR)/data.length - bw)/2;
      const bh = Math.round((d[1]/max)*(H-padT-padB));
      const y = H-padB-bh;
      const label = d[0].slice(5); // MM-DD
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${couleur}" rx="3" opacity="0.9">
        <title>${d[0]} : ${fmtFCFA(d[1])}</title></rect>
        ${data.length<=14?`<text x="${x+bw/2}" y="${H-padB+14}" text-anchor="middle" font-size="9" fill="#888">${label}</text>`:''}`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#ddd" stroke-width="1"/>
      ${bars}
    </svg>`;
  }

  // Graphe donut type article
  function svgDonut(data){
    if(!data.length) return '';
    const total = data.reduce((a,d)=>a+d[1],0);
    const COLORS = ['#E8A93B','#68AAD1','#26282B','#A6402E','#5a9e6f','#9b59b6'];
    let angle = -90;
    const cx=70,cy=70,r=55,ri=30;
    const slices = data.map((d,i)=>{
      const pct = d[1]/total;
      const sweep = pct*360;
      const a1 = angle*Math.PI/180;
      const a2 = (angle+sweep)*Math.PI/180;
      const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      const xi1=cx+ri*Math.cos(a1),yi1=cy+ri*Math.sin(a1);
      const xi2=cx+ri*Math.cos(a2),yi2=cy+ri*Math.sin(a2);
      const lg = sweep>180?1:0;
      const path=`M${x1},${y1} A${r},${r} 0 ${lg},1 ${x2},${y2} L${xi2},${yi2} A${ri},${ri} 0 ${lg},0 ${xi1},${yi1} Z`;
      angle+=sweep;
      return `<path d="${path}" fill="${COLORS[i%COLORS.length]}" opacity="0.9"><title>${d[0]}: ${fmtFCFA(d[1])} (${Math.round(pct*100)}%)</title></path>`;
    }).join('');
    const legend = data.map((d,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:4px;"><span style="width:12px;height:12px;border-radius:2px;background:${COLORS[i%COLORS.length]};flex-shrink:0;"></span><span style="color:#555;">${escapeHtml(d[0])}</span><span style="margin-left:auto;font-weight:600;">${Math.round(d[1]/total*100)}%</span></div>`).join('');
    return `<div style="display:flex;align-items:center;gap:20px;">
      <svg viewBox="0 0 140 140" style="width:140px;height:140px;flex-shrink:0;">${slices}</svg>
      <div style="flex:1;">${legend}</div>
    </div>`;
  }

  // Graphe barres horizontales commerciaux
  function svgCommerciaux(data){
    if(!data.length) return '';
    const max=Math.max(...data.map(d=>d[1]),1);
    return data.map(([nom,val])=>`
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">

          <div style="background:linear-gradient(90deg,#E8A93B,#f4c96a);height:100%;width:${Math.round(val/max*100)}%;border-radius:4px;transition:width .5s;"></div>
        </div>
      </div>`).join('');
  }

  function evol(val, prec){
    if(prec===null) return '';
    const sign = val>=0?'+':'';
    const color = val>=0?'#2d7a3a':'#A6402E';
    return `<span style="font-size:12px;color:${color};font-weight:600;">${sign}${val}% vs période préc.</span>`;
  }

  const periodeLabel = {jour:'Aujourd\'hui',semaine:'Cette semaine',mois:'Ce mois',annee:'Cette année',custom:'Période personnalisée'};

  return `
  <div class="main-head">
    <div><h2>Analyse</h2><p>${isAdmin()?'Vue globale de l\'activité':'Mes performances — '+escapeHtml(state.commercial)}</p></div>
  </div>

  <!-- FILTRES -->
  <div class="panel" style="padding:16px 20px;margin-bottom:0;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      ${['jour','semaine','mois','annee','custom'].map(p=>`
        <button data-periode="${p}" onclick="state.analysePeriode=this.dataset.periode;render();" style="padding:7px 16px;border-radius:20px;border:2px solid ${periode===p?'#E8A93B':'#ddd'};background:${periode===p?'#E8A93B':'#fff'};color:${periode===p?'#26282B':'#555'};font-weight:${periode===p?'700':'400'};font-size:13px;cursor:pointer;">${{jour:'Aujourd\'hui',semaine:'Cette semaine',mois:'Ce mois',annee:'Cette année',custom:'Personnalisé'}[p]}</button>
      `).join('')}
      ${periode==='custom'?`
        <input type="date" id="an-debut" value="${dateDebut}" max="${today}" onchange="state.analyseDebut=this.value;render();" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;">
        <span style="color:#888;">→</span>
        <input type="date" id="an-fin" value="${dateFin||today}" max="${today}" onchange="state.analyseFin=this.value;render();" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;">
      `:''}
    </div>
    <div style="margin-top:8px;font-size:12px;color:#9a998f;">Période : <b>${debut}</b> → <b>${fin}</b></div>
  </div>

  <!-- KPIs -->
  <div class="kpi-row" style="margin-top:12px;">
    <div class="kpi"><div class="lbl">Chiffre d'affaires</div><div class="val" style="font-size:22px;">${fmtFCFA(ca)}</div>${evolCa!==null?evol(evolCa,0):''}</div>
    <div class="kpi"><div class="lbl">Nombre de ventes</div><div class="val">${nb}</div><div class="sub">${nbPrec} sur la période préc.</div></div>
    <div class="kpi"><div class="lbl">Panier moyen</div><div class="val" style="font-size:18px;">${fmtFCFA(panier)}</div></div>
    <div class="kpi ${reste>0?'warn':''}"><div class="lbl">Reste à encaisser</div><div class="val" style="font-size:18px;">${fmtFCFA(reste)}</div></div>
    <div class="kpi"><div class="lbl">Nouveaux prospects</div><div class="val">${prospP.length}</div><div class="sub">Taux conv. : ${txConv}%</div></div>
    ${bonTotal>0?`<div class="kpi warn"><div class="lbl">Bons assurance à récupérer</div><div class="val" style="font-size:18px;">${fmtFCFA(bonTotal)}</div></div>`:''}
  </div>

  <!-- GRAPHE CA PAR JOUR -->
  <div class="panel">
    <h3 style="margin-bottom:14px;">Évolution du CA sur la période</h3>
    ${svgBarres(joursArr)}
  </div>

  <!-- LIGNE 2 : TYPE + BOUTIQUE -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
    <div class="panel">
      <h3 style="margin-bottom:14px;">Répartition par type d'article</h3>
      ${svgDonut(typesOrder)}
    </div>
    <div class="panel">
      <h3 style="margin-bottom:14px;">CA par boutique</h3>
      ${svgDonut(Object.entries(parBoutique).sort((a,b)=>b[1]-a[1]))}
    </div>
  </div>

  <!-- ASSURANCES -->
  <div class="panel">

      ${svgDonut([[`Avec assurance (${avecAss})`, avecAss],[`Sans assurance (${sansAss})`, sansAss]].filter(d=>d[1]>0))}

        <div style="font-size:13px;color:#555;margin-bottom:8px;">Bons assurance en attente de remboursement :</div>

        <div style="font-size:12px;color:#9a998f;margin-top:4px;">${avecAss} vente(s) avec assurance sur ${nb} au total</div>
      </div>
    </div>
  </div>

  <!-- CLASSEMENT COMMERCIAUX (admin seulement) -->
  ${isAdmin() && Object.keys(parCommercial).length ? `

  <!-- PROSPECTS & CONVERSION -->
  <div class="panel">

            <div style="background:${col};height:100%;width:${prospP.length>0?Math.round(val/prospP.length*100):0}%;border-radius:4px;"></div>
          </div>

      <div style="text-align:right;font-size:13px;margin-top:4px;"><b>Taux de conversion : <span style="color:#E8A93B;">${txConv}%</span></b></div>
    </div>
  </div>

  <!-- OBJECTIFS -->
  ${(()=>{
    const user = USERS_CACHE.find(u=>u.id===state.userId);
    if(!user) return '';
    const objAnnuel = Number(user.objectifAnnuel)||0;
    let objMensuels = {};
    if(user.objectifsMensuels){ try{ objMensuels = JSON.parse(user.objectifsMensuels); }catch(e){} }
    const nowM = new Date();
    const moisIdx = nowM.getMonth();
    const annee = nowM.getFullYear();
    const objMois = Number(objMensuels[moisIdx])||0;
    const debutMois = `${annee}-${String(moisIdx+1).padStart(2,'0')}-01`;
    const finMois = nowM.toISOString().slice(0,10);
    const vMois = mesVentes.filter(v=>{const d=(v.dateMiseEnRelation||'').slice(0,10);return d>=debutMois&&d<=finMois;});
    const caMois = vMois.reduce((a,v)=>a+venteTotal(v),0);
    const debutAnnee = `${annee}-01-01`;
    const vAnnee = mesVentes.filter(v=>{const d=(v.dateMiseEnRelation||'').slice(0,10);return d>=debutAnnee&&d<=finMois;});
    const caAnnee = vAnnee.reduce((a,v)=>a+venteTotal(v),0);
    const pctMois = objMois>0 ? Math.min(Math.round(caMois/objMois*100),100) : null;
    const pctAnnee = objAnnuel>0 ? Math.min(Math.round(caAnnee/objAnnuel*100),100) : null;
    const moisEcoules = moisIdx+1;
    const projAnnee = moisEcoules>0 ? Math.round(caAnnee/moisEcoules*12) : 0;

    function pBar(pct, col='#E8A93B'){
      const c = pct>=100?'#2d7a3a':pct>=70?col:'#A6402E';
      return `<div style="background:#f0efe9;border-radius:8px;height:16px;overflow:hidden;margin:8px 0;"><div style="background:${c};height:100%;width:${pct}%;border-radius:8px;"><span style="display:${pct>=15?'block':'none'};text-align:right;padding-right:8px;line-height:16px;font-size:11px;font-weight:700;color:#fff;">${pct}%</span></div></div>`;
    }

    if(!objAnnuel && !objMois) return `<div class="panel" style="border:2px dashed #ddd;text-align:center;padding:28px;color:#9a998f;"><div style="font-size:32px;margin-bottom:8px;">🎯</div><div style="font-weight:600;margin-bottom:4px;">Aucun objectif défini pour l'instant</div><div style="font-size:13px;">La directrice peut fixer vos objectifs dans Gestion comptes.</div></div>`;

    const lignesMois = MOIS.map((m,i)=>{
      const obj = Number(objMensuels[i])||0;
      const deb = `${annee}-${String(i+1).padStart(2,'0')}-01`;
      const finM = i===11?`${annee}-12-31`:`${annee}-${String(i+2).padStart(2,'0')}-01`;
      const caM = mesVentes.filter(v=>{const d=(v.dateMiseEnRelation||'').slice(0,10);return d>=deb&&d<finM;}).reduce((a,v)=>a+venteTotal(v),0);
      const pct = obj>0?Math.round(caM/obj*100):null;
      const estFutur = i>moisIdx, estCourant = i===moisIdx;
      return `<tr style="${estCourant?'background:#FFF9EF;font-weight:600;':''}${estFutur?'opacity:.45;':''}">
        <td>${m}${estCourant?' <span style="background:#E8A93B;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;">EN COURS</span>':''}</td>
        <td style="text-align:right;">${obj>0?fmtFCFA(obj):'<span style="color:#ccc;">—</span>'}</td>
        <td style="text-align:right;">${estFutur?'<span style="color:#ccc;">—</span>':fmtFCFA(caM)}</td>
        <td style="text-align:right;">${pct!==null&&!estFutur?`<span style="color:${pct>=100?'#2d7a3a':pct>=70?'#E8A93B':'#A6402E'};font-weight:700;">${pct}%</span>`:'<span style="color:#ccc;">—</span>'}</td>
      </tr>`;
    }).join('');

    return `<div class="panel">
      <h3 style="margin-bottom:16px;">🎯 Mes objectifs ${annee}</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
        <div style="background:var(--sand-light);border-radius:10px;padding:16px;">
          <div style="font-size:11px;font-weight:700;color:#E8A93B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">${MOIS[moisIdx]} ${annee}</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <span style="font-size:22px;font-weight:700;">${fmtFCFA(caMois)}</span>
            <span style="font-size:12px;color:#888;">/ ${objMois>0?fmtFCFA(objMois):'non défini'}</span>
          </div>
          ${pctMois!==null?pBar(pctMois):''}
          ${pctMois!==null?`<div style="font-size:12px;color:#666;">${pctMois>=100?'Objectif mensuel atteint ✅':fmtFCFA(objMois-caMois)+' restants'}</div>`:''}
        </div>
        <div style="background:var(--sand-light);border-radius:10px;padding:16px;">
          <div style="font-size:11px;font-weight:700;color:#68AAD1;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Année ${annee}</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;">
            <span style="font-size:22px;font-weight:700;">${fmtFCFA(caAnnee)}</span>
            <span style="font-size:12px;color:#888;">/ ${objAnnuel>0?fmtFCFA(objAnnuel):'non défini'}</span>
          </div>
          ${pctAnnee!==null?pBar(pctAnnee,'#68AAD1'):''}
          ${objAnnuel>0?`<div style="font-size:12px;color:#666;">Projection au rythme actuel : <b style="color:${projAnnee>=objAnnuel?'#2d7a3a':'#A6402E'};">${fmtFCFA(projAnnee)}</b></div>`:''}
        </div>
      </div>
      <h4 style="margin-bottom:10px;font-size:13px;color:#555;">Suivi mensuel ${annee}</h4>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Mois</th><th style="text-align:right;">Objectif</th><th style="text-align:right;">Réalisé</th><th style="text-align:right;">Atteinte</th></tr></thead>
        <tbody>${lignesMois}</tbody>
      </table></div>
    </div>`;
  })()}
  `;
}
