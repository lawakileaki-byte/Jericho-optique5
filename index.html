function bindClick(id, fn){ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); }
function bindFilter(id, setter, evt){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener(evt, ()=>{
    setter(el.value);
    const val = el.value;
    const pos = el.selectionStart;
    render();
    // Remettre le focus et la position du curseur après render
    const newEl = document.getElementById(id);
    if(newEl){
      newEl.focus();
      if(evt==='input') try{ newEl.setSelectionRange(pos, pos); }catch(e){}
    }
  });
}

function attachVenteConditionalLogic(){
  const type = document.getElementById('v-article');
  if(!type) return;
  const toggleSections = ()=>{
    const t = type.value;
    const show = (id, cond) => { const el = document.getElementById(id); if(el) el.style.display = cond ? '' : 'none'; };
    show('sec-reparation', t==='Réparation et entretien');
    show('sec-assurance', t==='Monture / Verres correcteurs' || t==='Lentilles');
    show('sec-staff', t!=='Réparation et entretien');
    show('sec-prescription', t==='Monture / Verres correcteurs');
    show('sec-accessoires-cost', t==='Accessoires');
    show('sec-pricing-global', t==='Monture / Verres correcteurs' || t==='Lentilles');
  };
  type.addEventListener('change', toggleSections);
  toggleSections();

  const bindAutre = (selectId, wrapId) => {
    const sel = document.getElementById(selectId);
    const wrap = document.getElementById(wrapId);
    if(!sel || !wrap) return;
    const update = ()=>{ wrap.style.display = sel.value==='Autre' ? '' : 'none'; };
    sel.addEventListener('change', update);
    update();
  };
  // Calcul automatique du total
  window.calcVenteTotal = function(){
    const monture = Number(document.getElementById('v-prix-monture')?.value)||0;
    const lentilles = Number(document.getElementById('v-prix-lentilles')?.value)||0;
    const lentilles2 = Number(document.getElementById('v-prix-lentilles-2e')?.value)||0;
    const monture2 = Number(document.getElementById('v-prix-monture-2e')?.value)||0;
    const total = monture + lentilles + lentilles2 + monture2;
    const elTotal = document.getElementById('v-prix-total');
    if(elTotal) elTotal.value = total || '';
    window.calcVenteReste();
  };

  window.calcVenteReste = function(){
    const total = Number(document.getElementById('v-prix-total')?.value)||0;
    const remise = Number(document.getElementById('v-remise')?.value)||0;
    const avance = Number(document.getElementById('v-avance')?.value)||0;
    const assurance = document.getElementById('v-assurance')?.value || '';
    const hasBon = assurance && assurance !== "Pas d'assurance";
    const bon = hasBon ? (Number(document.getElementById('v-bon')?.value)||0) : 0;
    const reste = Math.max(total - remise - avance - bon, 0);
    // Afficher le reste avec séparateurs de milliers
    const elReste = document.getElementById('v-reste-display');

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function exportCSV(rows, fields, filename){
  if(!rows.length){ showToast('Rien à exporter.'); return; }
  const header = fields.join(';');
  const lines = rows.map(r=>fields.map(f=>`"${String(r[f]!==undefined?r[f]:'').replace(/"/g,'""')}"`).join(';'));
  const csv = [header, ...lines].join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Export CSV téléchargé.');
}

   DEMARRAGE
   ========================================================= */
(async function init(){
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'IBM Plex Sans',sans-serif;color:#8a8980;">Chargement de Jéricho Optique…</div>`;
  await loadAll();
  await loadUsers();
  // Si déjà connecté via sessionStorage, restaurer la vue et l'onglet
  if(state.commercial && state.role){
    state.view = 'equipe';
    state.teamTab = state.role==='admin' ? 'dashboard' : 'journee';
  }
  render();

  // ===== DÉLÉGATION GLOBALE — form-changepwd =====
  // Utilise la capture sur document pour attraper le submit
  // même quand le formulaire est rendu après le premier attachGlobalEvents
  document.addEventListener('submit', async (e)=>{
    if(e.target.id !== 'form-changepwd') return;
    e.preventDefault();
    e.stopPropagation();

    const oldPwd = document.getElementById('cp-old')?.value || '';
    const newPwd = document.getElementById('cp-new')?.value || '';
    const newPwd2 = document.getElementById('cp-new2')?.value || '';
    const errEl = document.getElementById('cp-error');
    const btn = e.target.querySelector('button[type=submit]');

    if(btn){ btn.textContent = 'Vérification...'; btn.disabled = true; }
    await loadUsers();
    if(btn){ btn.textContent = 'Enregistrer le nouveau mot de passe'; btn.disabled = false; }

    const showErr = (msg) => {
      if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; }
      else { showToast(msg); }
    };

    const user = USERS_ALL_CACHE.find(u=>u.id===state.userId)
               || USERS_CACHE.find(u=>u.id===state.userId)
               || USERS_ALL_CACHE.find(u=>u.nom===state.commercial)
               || USERS_CACHE.find(u=>u.nom===state.commercial);

    if(!user){ showErr('Compte introuvable. Reconnectez-vous.'); return; }
    if(user.motDePasse !== oldPwd){ showErr('Mot de passe actuel incorrect.'); return; }
    if(newPwd !== newPwd2){ showErr('Les deux nouveaux mots de passe ne correspondent pas.'); return; }
    if(newPwd.length < 6){ showErr('Minimum 6 caractères.'); return; }

    if(errEl) errEl.style.display = 'none';
    const updated = {...user, motDePasse: newPwd};
    try{
      await saveUser(updated);
      const idxAll = USERS_ALL_CACHE.findIndex(u=>u.id===user.id);
      if(idxAll>=0) USERS_ALL_CACHE[idxAll].motDePasse = newPwd;
      const idxActif = USERS_CACHE.findIndex(u=>u.id===user.id);
      if(idxActif>=0) USERS_CACHE[idxActif].motDePasse = newPwd;
      if(document.getElementById('cp-old')) document.getElementById('cp-old').value = '';
      if(document.getElementById('cp-new')) document.getElementById('cp-new').value = '';
      if(document.getElementById('cp-new2')) document.getElementById('cp-new2').value = '';
      showToast('✅ Mot de passe changé avec succès !');
    }catch(err){
      showErr("Erreur d'enregistrement, réessaie.");
    }
  }, true); // true = capture phase — intercepte avant tout autre handler

})();

<!-- ===== SERVICE WORKER REGISTRATION ===== -->
<script>
if ('serviceWorker' in navigator) {
  // Désinstaller tout ancien Service Worker pour éviter les problèmes de cache
  navigator.serviceWorker.getRegistrations().then(regs => {
    for (const reg of regs) {
      reg.unregister();
      console.log('[PWA] Service Worker désinstallé (cache forcé)');
    }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/Jericho-optique5/sw.js', { scope: '/Jericho-optique5/' })
      .then(reg => {
        console.log('[PWA] Service Worker enregistré ✅', reg.scope);
        // Forcer la mise à jour immédiate
        reg.update();
        setInterval(() => reg.update(), 3600000);
      })
      .catch(err => {
        console.warn('[PWA] Service Worker non enregistré:', err);
      });
  });

  // Prompt d'installation Android
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Affiche une bannière d'installation discrète après 3 secondes
    setTimeout(() => {
      if (!deferredPrompt) return;
      const banner = document.createElement('div');
      banner.id = 'pwa-install-banner';
      banner.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-family:inherit;display:flex;align-items:center;gap:12px;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,0.4);border:1px solid rgba(232,169,59,0.3);max-width:90vw;';
      banner.innerHTML = '<span>📱 Installe Jéricho sur ton téléphone !</span><button onclick="window._installPWA()" style="background:#E8A93B;color:#1a1a2e;border:none;padding:7px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;">Installer</button><button onclick="document.getElementById(\'pwa-install-banner\').remove()" style="background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:18px;padding:0 4px;">×</button>';
      document.body.appendChild(banner);
    }, 3000);
  });

  window._installPWA = function() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice => {
      if (choice.outcome === 'accepted') {
        console.log('[PWA] Installation acceptée ✅');
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.remove();
      }
      deferredPrompt = null;
    });
  };

  window.addEventListener('appinstalled', () => {
    console.log('[PWA] Application installée ✅');
    const banner = document.getElementById('pwa-install-banner');
    if (banner) banner.remove();
    deferredPrompt = null;
  });
}
</script>
